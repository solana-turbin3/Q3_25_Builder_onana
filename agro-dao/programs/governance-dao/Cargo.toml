[package]
name = "governance-dao"
version = "0.1.0"
description = "Governance system for AgroDAO ecosystem"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "governance_dao"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

# Add other DAO programs as dependencies for CPI
treasury-dao = { path = "../treasury-dao", features = ["cpi"] }
research-dao = { path = "../research-dao", features = ["cpi"] }
reputation-dao = { path = "../reputation-dao", features = ["cpi"] }
